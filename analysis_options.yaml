include: package:flutter_lints/flutter.yaml

linter:
  rules:
    avoid_print: false

formatter:
  trailing_commas: preserve


analyzer:
  errors:
    invalid_annotation_target: ignore
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

